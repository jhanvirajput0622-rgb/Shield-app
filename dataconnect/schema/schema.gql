type User @table {
  displayName: String!
  email: String!
  avatarUrl: String
  role: String
}

type Project @table {
  name: String!
  owner: User!
  description: String
  startDate: Date
  endDate: Date
}

type Milestone @table {
  title: String!
  project: Project!
  dueDate: Date
  isCompleted: Boolean
}

type Task @table {
  title: String!
  status: String!
  description: String
  project: Project!
  milestone: Milestone
  assignedTo: User
}

type Comment @table {
  content: String!
  task: Task!
  author: User!
  createdAt: Timestamp
}